<text class="title" x="450.0" y="23" text-anchor="middle">ZizkaDB quickstart — ~60 seconds</text>
<text class="l0 cmd" x="28" y="70"><tspan class="p">$ </tspan>curl -fsSL https://raw.githubusercontent.com/ZIZKA-AI-SL/ZizkaDB/main/scripts/quickstart-remote.sh | bash</text>
<text class="l1 acc" x="28" y="94">  ZizkaDB — remote quickstart (no repo clone)</text>
<text class="l2 out" x="28" y="118">→ Downloading compose + schema (not the full repo)...</text>
<text class="l3 out" x="28" y="142">→ Pulling pre-built images from ghcr.io/zizka-ai-sl/ ...</text>
<text class="l4 out" x="28" y="166">→ Starting stack (postgres, qdrant, redis, api, dashboard)...</text>
<text class="l5 ok" x="28" y="190">✔ API healthy on http://localhost:8000</text>
<text class="l6 out" x="28" y="214">→ Installing SDK from PyPI...</text>
<text class="l7 out" x="28" y="238">→ Running causal lineage demo...</text>
<text class="l9 acc" x="28" y="286">tool_call · lookup_order · ORD-8842</text>
<text class="l10 out" x="28" y="310">  └── llm_response · gpt-4o</text>
<text class="l11 out" x="28" y="334">        └── user_message · Why was my order delayed?</text>
<text class="l13 ok" x="28" y="382">  Done — Dashboard: http://localhost:3001/login</text>
<text class="l14 cmd" x="28" y="406"><tspan class="p">$ </tspan>zizkadb why &lt;event_id&gt;   # ask why, any time</text>
