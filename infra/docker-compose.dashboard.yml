# Optional: run dashboard in Docker (dev/CI only). Production uses PM2 on :3001.
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dashboard.yml up -d dashboard

services:
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEV_MODE: ${NEXT_PUBLIC_DEV_MODE:-false}
        # Which edition the dashboard renders as: self_hosted (4 tabs) or
        # managed (adds Agent Fleets). Mirrors the backend DEPLOYMENT_MODE.
        NEXT_PUBLIC_DEPLOYMENT_MODE: ${NEXT_PUBLIC_DEPLOYMENT_MODE:-self_hosted}
    container_name: zizkadb_dashboard
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
