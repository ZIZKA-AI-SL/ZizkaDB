# API + data services only.
# Dashboard runs on the host via PM2 (see dashboard/ecosystem.config.js).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zizkadb_postgres

    # WARNING:
    # docker compose down -v deletes ALL user accounts and events.
    # Production: use bash infra/deploy-production.sh — never -v.
    # WARNING: docker compose down -v deletes ALL user accounts and events.
    # Never use -v on a machine with data you care about.
    # Local reset only: bash scripts/reset-local-db.sh

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zizkadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zizkadb}
      POSTGRES_DB: ${POSTGRES_DB:-zizkadb}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../core/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  qdrant:
    # Pin the version instead of using latest
    image: qdrant/qdrant:v1.15.4
    container_name: zizkadb_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zizkadb_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build:
      context: ../core
      dockerfile: Dockerfile

    container_name: zizkadb_api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zizkadb}:${POSTGRES_PASSWORD:-zizkadb}@postgres:5432/${POSTGRES_DB:-zizkadb}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}

      # No defaults: production refuses to start without real secrets, and
      # ENV=development falls back to local-only dev values in core.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}

      # Required. production on any reachable server; development only on a
      # local machine (enables zizkadb_dev_local and login-free dev-token).
      ENV: ${ENV:?Set ENV in infra/.env - production for a server, development for local use only}
      DEV_API_KEY: ${DEV_API_KEY:-}
      # IMPORTANT FOR SELF-HOSTERS: set DEPLOYMENT_MODE=self_hosted in your
      # infra/.env (see .env.example). Without it, plan-based API key limits
      # are evaluated as if you are a managed-cloud tenant (default: "managed").
      # This file is also used by infra/deploy-production.sh for the managed
      # cloud, so the in-compose default must stay "managed" — self-hosters
      # must override via their .env file (see wiki/Self-Hosting.md).
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-managed}
      # Self-hosted dashboard sign-in when ENV=production (empty = login disabled).
      SELFHOST_ADMIN_TOKEN: ${SELFHOST_ADMIN_TOKEN:-}
      # Self-hosted semantic search / context_for (needs OPENAI_API_KEY and the
      # embed-worker). Ignored on managed deployments, which always embed.
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      # Comma-separated browser origins allowed to call the API (empty = any).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Email — optional; enables OTP login on self-hosted dashboard
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}

      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://db.zizka.ai}
      COMMUNITY_UPLOAD_DIR: /data/community_uploads

      DASHBOARD_URL: ${DASHBOARD_URL:-https://db.zizka.ai}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      - community_uploads:/data/community_uploads

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  embed-worker:
    build:
      context: ../core
      dockerfile: Dockerfile
    container_name: zizkadb_embed_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zizkadb}:${POSTGRES_PASSWORD:-zizkadb}@postgres:5432/${POSTGRES_DB:-zizkadb}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENV: ${ENV:?Set ENV in infra/.env - production for a server, development for local use only}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-managed}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      # Decrypts per-tenant BYOK embedding keys, which the API encrypts with it.
      JWT_SECRET: ${JWT_SECRET:-}
      EMBED_WORKER_POLL_SEC: ${EMBED_WORKER_POLL_SEC:-2}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: python workers/embed_worker.py
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  community_uploads:
