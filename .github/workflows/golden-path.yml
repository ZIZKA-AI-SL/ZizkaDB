name: Golden path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: golden-path-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIZKADB_TELEMETRY: "false"


permissions:
  contents: read

jobs:
  golden-path:
    name: golden-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start stack
        run: |
          cp infra/.env.quickstart infra/.env
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.golden-path.yml up -d postgres redis qdrant api
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && break
            sleep 3
          done
          ready=false
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health/deep | python3 -c "import sys,json; c=json.load(sys.stdin).get('checks',{}); sys.exit(0 if c.get('postgres',{}).get('ok') and c.get('redis',{}).get('ok') else 1)"; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            curl -sf http://localhost:8000/health/deep || true
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.golden-path.yml logs api --tail 40
            exit 1
          fi

      - name: Run golden path
        run: bash scripts/run-golden-path.sh
