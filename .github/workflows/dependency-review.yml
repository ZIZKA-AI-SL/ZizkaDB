name: Dependency review

# Blocks a pull request that adds a dependency with a known vulnerability of
# moderate severity or higher, or a known-malicious package (GitHub advisories
# include malware). Policy: SECURITY.md "Dependency and code scanning".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Copyleft-compatible project: block only licences that cannot ship in AGPL code.
          deny-licenses: SSPL-1.0, BUSL-1.1
