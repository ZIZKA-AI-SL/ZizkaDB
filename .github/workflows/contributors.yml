name: Contributors

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # main is protected (no direct pushes), so changes arrive as a pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate contributors grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributors.py "$GITHUB_REPOSITORY"
      - name: Open a pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && exit 0
          branch=bot/contributors
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git commit -am 'docs(readme): sync contributors' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push --force origin "$branch"
          gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN \
            || gh pr create --head "$branch" --title 'docs(readme): sync contributors' \
                 --body 'Automated contributors grid update.'
