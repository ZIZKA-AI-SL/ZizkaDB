name: Contributors

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # main is protected (no direct pushes), so changes arrive as a pull request.
    # A maintainer opens it from the link this job leaves. "Allow GitHub Actions
    # to create and approve pull requests" stays off: a workflow's approval would
    # count as the required review.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate contributors grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributors.py "$GITHUB_REPOSITORY"
      - name: Push the branch for a pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && exit 0
          branch=bot/contributors
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git commit -am 'docs(readme): sync contributors' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push --force origin "$branch"
          # A push made with GITHUB_TOKEN does not start other workflows.
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            msg='The open contributors pull request was updated. Close and reopen it to run the required checks.'
          else
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            msg="Open a pull request from $url and check that it only changes README.md."
          fi
          echo "::notice title=Contributors grid changed::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
