name: Contributors

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # main is protected (no direct pushes), so changes arrive as a pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate contributors grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributors.py "$GITHUB_REPOSITORY"
      - name: Open a pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && exit 0
          branch=bot/contributors
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git commit -am 'docs(readme): sync contributors' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push --force origin "$branch"
          gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN && exit 0
          # Opening or pushing with GITHUB_TOKEN does not start other workflows.
          body=$(printf '%s\n\n%s' 'Automated contributors grid update.' \
            'Required checks do not start when GitHub Actions opens or updates this pull request. Close and reopen it to run them on the latest commit.')
          if out=$(gh pr create --head "$branch" --title 'docs(readme): sync contributors' --body "$body" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          # "Allow GitHub Actions to create and approve pull requests" is off for this
          # repository. The branch is pushed, so leave a link instead of failing.
          grep -q 'not permitted to create' <<<"$out" || exit 1
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          echo "::warning title=Contributors pull request not opened::GitHub Actions may not open pull requests in this repository. Open it here: $url"
          echo "The contributors grid changed. [Open the pull request]($url)." >> "$GITHUB_STEP_SUMMARY"
