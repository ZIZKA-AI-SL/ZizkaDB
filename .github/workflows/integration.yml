name: Integration tests

on:
  workflow_dispatch:
  schedule:
    # Weekly smoke — non-blocking signal for self-host / stack regressions
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  integration:
    name: core-integration
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt

      - name: Start stack
        run: |
          # Compose requires ENV; keep the job's previous defaults (development, managed).
          echo 'ENV=development' > infra/.env
          docker compose -f infra/docker-compose.yml up -d --wait --timeout 120

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt -r core/requirements-dev.txt
          pip install -e sdk/python

      - name: Core integration tests
        env:
          ZIZKADB_RUN_INTEGRATION: "1"
        run: pytest core/tests/ -m integration -v

      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down
