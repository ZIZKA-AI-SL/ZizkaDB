name: Publish MCP server to the MCP Registry

# Run after zizkadb-mcp is on PyPI at the version in mcp/server.json: the
# registry checks that the PyPI README carries the mcp-name marker. Publishes
# io.github.zizka-ai-sl/zizkadb-mcp through GitHub OIDC (no stored secret).
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the version is on PyPI with the registry marker
        run: |
          set -euo pipefail
          version="$(jq -r '.packages[0].version' mcp/server.json)"
          name="$(jq -r '.name' mcp/server.json)"
          readme="$(curl -fsSL "https://pypi.org/pypi/zizkadb-mcp/${version}/json" | jq -r '.info.description')" \
            || { echo "::error::zizkadb-mcp ${version} is not on PyPI yet. Publish it first."; exit 1; }
          grep -q "mcp-name: ${name}" <<<"$readme" \
            || { echo "::error::The PyPI README of zizkadb-mcp ${version} has no 'mcp-name: ${name}' line."; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        working-directory: mcp
        run: ../mcp-publisher publish

      - name: Show the listing
        run: |
          name="$(jq -r '.name' mcp/server.json)"
          curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=${name}" | jq '.servers[].server | {name, version}'
