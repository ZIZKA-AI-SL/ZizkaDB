[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zizkadb-mcp"
version = "0.1.8"
description = "MCP server for ZizkaDB, the audit trail database for AI agents: query tamper-evident decision logs from Cursor, Claude Desktop, and any MCP client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Zizka AI", email = "founder@zizka.ai" }]
keywords = ["mcp", "ai", "agents", "audit", "observability", "zizkadb", "claude", "cursor", "causal-lineage", "audit-trail", "tamper-evident", "eu-ai-act", "article-12", "session-replay", "time-travel-debugging", "drift-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
zizkadb-mcp = "zizkadb_mcp.server:main"

[project.urls]
Homepage = "https://db.zizka.ai"
Documentation = "https://db.zizka.ai/docs"
Repository = "https://github.com/Zizka-ai/ZizkaDB"
Issues = "https://github.com/Zizka-ai/ZizkaDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zizkadb_mcp*"]
