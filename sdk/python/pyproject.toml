[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zizkadb-sdk"
version = "0.3.0"
description = "Audit trail database for AI agents: tamper-evident, checksum-backed decision logs, session replay and time-travel debugging to support EU AI Act Article 12 record-keeping."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Zizka AI", email = "founder@zizka.ai" }]
keywords = ["ai-agents", "causal-lineage", "agent-audit", "self-hosted", "langchain", "crewai", "llm-debugging", "behavioral-drift", "gdpr", "observability", "audit-trail", "tamper-evident", "eu-ai-act", "article-12", "session-replay", "time-travel-debugging", "drift-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.27.0"]

[project.scripts]
zizkadb = "zizkadb.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://db.zizka.ai"
Documentation = "https://db.zizka.ai/docs"
Repository = "https://github.com/Zizka-ai/ZizkaDB"
Issues = "https://github.com/Zizka-ai/ZizkaDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zizkadb*"]

[tool.setuptools.package-data]
zizkadb = ["templates/**/*", "templates/**/.env.example"]
