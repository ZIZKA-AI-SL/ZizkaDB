[project]
name = "zizkadb-langgraph"
version = "0.1.0"
description = "LangGraph middleware for ZizkaDB — automatic causal logging per graph node"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "zizkadb-sdk>=0.3.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]

[project.entry-points."zizkadb.integrations"]
langgraph = "zizkadb_langgraph.middleware"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zizkadb_langgraph"]
