[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zizkadb-livekit"
version = "0.2.1"
description = "LiveKit Agents observer for ZizkaDB — one session per call, transcript from LiveKit (no audio stored)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Zizka AI", email = "founder@zizka.ai" }]
keywords = [
    "livekit",
    "voice-agents",
    "ai-agents",
    "causal-lineage",
    "agent-audit",
    "observability",
    "zizkadb",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "zizkadb-sdk>=0.3.0",
    "livekit-agents>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://db.zizka.ai"
Documentation = "https://db.zizka.ai/docs"
Repository = "https://github.com/Zizka-ai/ZizkaDB"
Issues = "https://github.com/Zizka-ai/ZizkaDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zizkadb_livekit*"]
